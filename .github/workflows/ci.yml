name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AUDIT_LOG_OTEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `just build` (pulled in by `just functional`) runs `just web-build`,
      # which builds the SPA embedded via internal/web/dist.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"

      - run: just arch
      - run: just unit
      - run: just functional
